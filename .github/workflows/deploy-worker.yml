name: Deploy SalonBoard Cloud Worker (EC2)

on:
  push:
    branches: [main]
    paths:
      - worker.ts
      - electron/scrapers.cjs
      - electron/worker-process.cjs
      - salonboard-selectors.ts
      - salonboard-rescan.ts
      - canary.ts
      - package.json
      - package-lock.json
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

concurrency:
  group: salonboard-cloud-worker-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  EC2_INSTANCE_ID: i-0f1cc0aff1ac8dd2e
  # 一括系(lane_bulk)ワーカー箱。メインと同一バンドルを配布する (2026-08-07 レーン分割)。
  BULK_EC2_INSTANCE_ID: i-06a56736ddc6512f8
  # 投稿系(lane_post)ワーカー箱。ブログ/スタイル/フォト/クーポン/メニューの反映専任 (2026-08-08)。
  POST_EC2_INSTANCE_ID: i-0e77765c6ca7843eb
  DEPLOY_BUCKET: kireidot-sb-worker-debug-972293797066
  CONTAINER_NAME: sb-worker-cloud
  BULK_CONTAINER_NAME: sb-worker-bulk
  POST_CONTAINER_NAME: sb-worker-post
  REMOTE_WORKER_PATH: /opt/kireidot/worker.cjs

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      # EC2 container has Playwright in its runtime image. Keep it external so
      # Desktop and Cloud execute the exact same worker source from this commit.
      - name: Build Cloud worker bundle
        run: |
          npx esbuild worker.ts \
            --bundle --platform=node --format=cjs --target=node22 \
            --external:playwright --outfile=worker.cjs
          sha256sum worker.cjs

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload immutable bundle
        run: aws s3 cp worker.cjs "s3://$DEPLOY_BUCKET/deploy/$GITHUB_SHA/worker.cjs"

      - name: Deploy to EC2 through SSM
        shell: bash
        run: |
          set -euo pipefail
          URL=$(aws s3 presign "s3://$DEPLOY_BUCKET/deploy/$GITHUB_SHA/worker.cjs" --expires-in 900)
          PARAMS=$(jq -nc --arg url "$URL" --arg path "$REMOTE_WORKER_PATH" --arg container "$CONTAINER_NAME" --arg sha "$GITHUB_SHA" '{commands:[
            "set -e",
            ("curl -fL --retry 3 --connect-timeout 10 " + ($url|@sh) + " -o " + ($path + ".next"|@sh)),
            ("test -s " + ($path + ".next"|@sh)),
            ("docker stop -t 40 " + ($container|@sh)),
            ("mv " + ($path + ".next"|@sh) + " " + ($path|@sh)),
            ("docker start " + ($container|@sh)),
            ("docker inspect " + ($container|@sh) + " " + ("--format=Status={{.State.Status}} Started={{.State.StartedAt}} RestartCount={{.RestartCount}}"|@sh)),
            ("echo deployed_commit=" + $sha)
          ]}')
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy-salonboard-worker-$GITHUB_SHA" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

      # 一括系(lane_bulk)ワーカー箱へ同一バンドルを配布。メイン成功後に実行する
      # (失敗した場合はワークフローが赤くなり、両箱のバージョン乖離に気付ける)。
      - name: Deploy to Bulk EC2 through SSM
        shell: bash
        run: |
          set -euo pipefail
          URL=$(aws s3 presign "s3://$DEPLOY_BUCKET/deploy/$GITHUB_SHA/worker.cjs" --expires-in 900)
          PARAMS=$(jq -nc --arg url "$URL" --arg path "$REMOTE_WORKER_PATH" --arg container "$BULK_CONTAINER_NAME" --arg sha "$GITHUB_SHA" '{commands:[
            "set -e",
            ("curl -fL --retry 3 --connect-timeout 10 " + ($url|@sh) + " -o " + ($path + ".next"|@sh)),
            ("test -s " + ($path + ".next"|@sh)),
            ("docker stop -t 40 " + ($container|@sh)),
            ("mv " + ($path + ".next"|@sh) + " " + ($path|@sh)),
            ("docker start " + ($container|@sh)),
            ("docker inspect " + ($container|@sh) + " " + ("--format=Status={{.State.Status}} Started={{.State.StartedAt}} RestartCount={{.RestartCount}}"|@sh)),
            ("echo deployed_commit=" + $sha)
          ]}')
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$BULK_EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy-salonboard-bulk-worker-$GITHUB_SHA" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$BULK_EC2_INSTANCE_ID"
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$BULK_EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

      - name: Deploy to Post EC2 through SSM
        shell: bash
        run: |
          set -euo pipefail
          URL=$(aws s3 presign "s3://$DEPLOY_BUCKET/deploy/$GITHUB_SHA/worker.cjs" --expires-in 900)
          PARAMS=$(jq -nc --arg url "$URL" --arg path "$REMOTE_WORKER_PATH" --arg container "$POST_CONTAINER_NAME" --arg sha "$GITHUB_SHA" '{commands:[
            "set -e",
            ("curl -fL --retry 3 --connect-timeout 10 " + ($url|@sh) + " -o " + ($path + ".next"|@sh)),
            ("test -s " + ($path + ".next"|@sh)),
            ("docker stop -t 40 " + ($container|@sh)),
            ("mv " + ($path + ".next"|@sh) + " " + ($path|@sh)),
            ("docker start " + ($container|@sh)),
            ("docker inspect " + ($container|@sh) + " " + ("--format=Status={{.State.Status}} Started={{.State.StartedAt}} RestartCount={{.RestartCount}}"|@sh)),
            ("echo deployed_commit=" + $sha)
          ]}')
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$POST_EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy-salonboard-post-worker-$GITHUB_SHA" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$POST_EC2_INSTANCE_ID"
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$POST_EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

      - name: Deployment summary
        run: |
          echo "### SalonBoard Cloud Worker" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- instance: \`$EC2_INSTANCE_ID\` + bulk \`$BULK_EC2_INSTANCE_ID\` + post \`$POST_EC2_INSTANCE_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- container: \`$CONTAINER_NAME\` + \`$BULK_CONTAINER_NAME\` + \`$POST_CONTAINER_NAME\`" >> "$GITHUB_STEP_SUMMARY"
